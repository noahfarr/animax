[project]
name = "animax"
version = "0.1.0"
description = "JAX/gymnax ports of the classical-conditioning state-construction benchmarks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnax>=0.0.8",
    "jax>=0.4.30",
    "numpy>=1.26",
    "flax>=0.8",
    "chex>=0.1.85",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "dm-env>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["animax"]
